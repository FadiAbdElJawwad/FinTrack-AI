name: fin_track_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^4.13.0
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  shared_preferences: ^2.5.5
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  local_auth: ^3.0.2
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/png/
    - assets/images/svg/

flutter_intl:
  enabled: true

flutter_native_splash:
  color: "#F8FAFC"

  color_dark: "#0F172A"

  android_12:
    color: "#F8FAFC"
    color_dark: "#0F172A"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/png/app_logo.png"
  min_sdk_android: 21